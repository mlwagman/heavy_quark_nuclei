<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MRS talk · presenter</title>
<style>
  body{margin:0;background:#111;color:#eee;font:20px/1.45 Georgia,serif;height:100vh;display:flex;flex-direction:column}
  #top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid #333;font-size:18px;color:#aaa}
  #clock{font:28px/1 monospace;color:#eee}
  #where{font-size:22px;color:#eee}
  #notes{flex:1;padding:22px 26px;font-size:34px;line-height:1.35;overflow:auto}
  #notes ul{margin:0;padding-left:1.1em} #notes li{margin:0 0 .5em}
  #notes .show{margin-top:1em;font-size:22px;color:#8fb8a8}
  #clock.late{color:#ff7a7a}
  #next{padding:14px 26px;border-top:1px solid #333;color:#8a8a8a;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar{display:flex;gap:12px;padding:12px 22px;border-top:1px solid #333}
  button{font:18px Georgia,serif;padding:8px 18px;background:#222;color:#eee;border:1px solid #555;border-radius:6px;cursor:pointer}
  #open{background:#3a3220}
</style>
</head>
<body>
<div id="top"><span id="where">not connected</span><span id="title"></span><span id="clock">00:00</span></div>
<div id="notes">Click <b>Open the World</b>, then drive it from here or with the clicker in the World's window (Right / Space / PageDown forward, Left / PageUp back).</div>
<div id="next"></div>
<div id="bar"><button id="open">Open the World</button><button id="prev">◀ back</button><button id="next_">next ▶</button><button id="ov">overview (o)</button><button id="reset">reset clock</button></div>
<script>
'use strict';
let w = null, t0 = Date.now(), state = null;
const $ = id => document.getElementById(id);
$('open').onclick = () => { w = window.open('index.html', 'mrs-world', 'width=1600,height=900'); setTimeout(() => w && w.postMessage({ type: 'hello' }, '*'), 1500); };
$('prev').onclick = () => w && w.postMessage({ type: 'prev' }, '*');
$('next_').onclick = () => w && w.postMessage({ type: 'next' }, '*');
$('reset').onclick = () => { t0 = Date.now(); };
$('ov').onclick = () => w && w.postMessage({ type: 'overview' }, '*');
addEventListener('keydown', ev => { const k = ev.key; if (k === ' ' || k === 'ArrowRight' || k === 'PageDown') { ev.preventDefault(); $('next_').onclick(); } else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); $('prev').onclick(); } else if (k === 'o' || k === 'O') { $('ov').onclick(); } });
addEventListener('message', ev => {
  const m = ev.data || {}; if (m.type !== 'state') return; state = m;
  const cur = m.run != null ? m.run : Math.max(0, m.done - 1);
  const started = m.run != null || m.done > 0;
  const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('where').textContent = `scene ${m.si + 1} / ${m.nScenes} · beat ${started ? cur + 1 : 0} / ${m.nBeats} · target ${mmss(m.target)}` + (m.overview ? ' · OVERVIEW' : '');
  $('title').textContent = m.title;
  /* keynotes, not sentences: a few words per beat, and what is on the screen and needs no words */
  const K = m.keys[started ? cur : 0] || { k: [] }, N = $('notes'); N.textContent = '';
  const ul = document.createElement('ul'); K.k.forEach(t => { ul.appendChild(document.createElement('li')).textContent = t; }); N.appendChild(ul);
  if (K.show) { const d = document.createElement('div'); d.className = 'show'; d.textContent = 'on screen, no need to say: ' + K.show; N.appendChild(d); }
  const nx = started ? (m.keys[cur + 1] || (m.nextKeys && m.nextKeys[0])) : m.keys[1];
  $('next').textContent = nx ? 'next → ' + nx.k[0] : '';
});
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  $('clock').classList.toggle('late', !!state && s > state.nextTarget); }, 500);   /* red: this panel should be over */
</script>
</body>
</html>
